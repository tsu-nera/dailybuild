# 種目名 → 主に効かせる部位（primary 1つだけ）
#
# secondary（ベンチプレスの三頭・前肩）は数えない。狙いが大胸筋に絞られていること、
# 種目が8個しかないことから単純な形で始める。0.5 で数える方式は後から足せる。
#
# キーは正規化後（NFKC + 空白畳み込み）の表記。yaml に無い種目は集計から
# 黙って落とさず、hevy.py show が警告として出す。
exercises:
  チェストプレス (マシーン):
    muscle: chest
  シーテッドディップマシン:
    muscle: chest
  ベンチプレス (ダンベル):
    muscle: chest
  シーテッドショルダープレス (マシン):
    muscle: shoulders
  ラットプルダウン (マシン):
    muscle: back
  デッドリフト (ダンベル):
    muscle: back
  レッグプレス ホリゾンタル (マシン):
    muscle: legs
  プリーチャーカール (マシン):
    muscle: arms

# 部位別・週あたりセット数の目標。キーは exercises.*.muscle と同じ語彙を使う
# （別ファイルに分けると、マッピングに無い部位名を目標に書いても気づけないため）。
#
# since は適用開始日の記録用。**週ごとに目標を切り替える実装は入れていない**
# （常に現在値を使う）。書き換えたとき過去週の分母が消えないようにするための欄。
#
# 初期値の根拠: 2026-W38 の実測が胸4・背中2・脚0（週6セット）。週あたりの実施回数
# （config/private/habits.yaml の target_per_week: 4）は既に達成できているので、
# 1回あたりのセット数を増やすだけで届く水準に置く。
weekly_sets:
  chest: {target: 6, since: 2026-09-21}
  back: {target: 6, since: 2026-09-21}
  legs: {target: 4, since: 2026-09-21}
