# files（compose 内部だけ）の配信設定。docs/grafana.md
server {
    listen 80;
    root /usr/share/nginx/html;   # reports/dashboard/*.csv（dashboard.py build）

    # 日次の全指標（journal_skeleton.py が毎日全上書き）。reports/ の他のファイルは配らない
    location = /metrics_daily.csv {
        alias /srv/reports/metrics_daily.csv;
    }
}
