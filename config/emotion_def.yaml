# 気分記録（Google Form）の定義
#
# フォームは scripts/emotion.py setup-form が この定義から生成する。
# 選択肢を足す/変えるときは vocabulary を直して setup-form --update を回す。
# 画面を手で直すと yaml とズレるので触らない。
# 語彙を変えたら必ず setup-form --update を回すこと。語彙の変更は
# data/emotion_vocab_history.csv に版として記録される（過去データを
# 読み違えないようにするため。詳細は CLAUDE.md の「気分記録」を参照）。

# setup-form が書き戻す。空なら未作成
form_id: 12H4gK9DnVl0tphr2DUBx5jgfXZmdkqYkaD8GArRBrus
form_title: 気分記録

# グリッド item 自体のタイトル（行ごとの questionId には無関係。画面の
# 見出しとしてのみ使う）
grid_title: いまの状態

# 質問タイトル。回答は questionId で引くので、ここを変えたら
# setup-form --update でフォーム側も合わせること。
# score/body/head はグリッド（1つの questionGroupItem）の行になる
questions:
  score: いまの気分
  body: 身体の軽さ
  # 2026-09-05 に「頭の冴え」から改名した。身体（軽さ）と同じ軸に揃えるため。
  # questionId は保持されるので過去回答も head 列に着地し続けるが、
  # 改名前の24件は「冴え」という別の構成概念で記録されている。
  # 版は data/emotion_grid_history.csv にあるので接いで読まないこと
  head: 頭の軽さ
  emotions: いまの気持ち
  note: 何があった？

# グリッドの行タイトル（questions のキー）の並び順。
# **この並びが questionId の対応付けそのもの（出現順=FIFO）。並び替えると
# 既存回答の questionId が別の行に付け替わる（PHQ-9 の9問と同じ制約。
# 詳細は docs/forms.md）。行を足すのは末尾に追加するだけでよい（既存行の
# questionId は保持される）が、既存行の削除・並べ替えはしないこと**
grid_rows: [score, body, head]

# グリッドの行ごとの必須/任意。grid_rows と同じキーで指定する。
# 全行必須にすると、気分だけ記録したいときも身体・頭を必ず答えることになり
# 1回あたりの記録コストが上がる（続けられるかに直結する）。いまの気分だけを
# 必須にし、身体の軽さ・頭の軽さは任意にしてある
grid_required:
  score: true
  body: false
  head: false

# グリッドの列（1〜5）。全行共通で、向きは全行「高=良好」（グリッドの列見出しが
# 行共通のため構造的に強制される）。manual_metrics の mind_score / body_score と
# 同じ向きで、将来一本化できるようにしてある。感情や身体感覚の「強さ」ではない
score:
  low: 1
  high: 5
  low_label: 悪い
  high_label: 良い

# フォームの選択肢。valence（快/不快）× arousal（覚醒度）の4象限を埋める。
# 陽性7つ・陰性4つ・中立1つ。陽性を多く置いているのは、回復の計器になるのが
# 陰性感情の量ではなく陽性感情の頻度のため。「やりきった・達成感」は行動活性化の
# Mastery 軸（他は Pleasure/Serenity 系で、これが無いと達成感の頻度が数えられない）
vocabulary:
  - {label: 楽しい・うれしい,   valence: pos, arousal: high}
  - {label: わくわくする,       valence: pos, arousal: high}
  - {label: 興味がわく,         valence: pos, arousal: high}
  - {label: やりきった・達成感, valence: pos, arousal: high}
  - {label: 落ち着いている,     valence: pos, arousal: low}
  - {label: ほっとした,         valence: pos, arousal: low}
  - {label: 感謝している,       valence: pos, arousal: low}
  - {label: イライラ,           valence: neg, arousal: high}
  - {label: 不安・焦り,         valence: neg, arousal: high}
  - {label: 悲しい,             valence: neg, arousal: low}
  - {label: つらい・重い,       valence: neg, arousal: low}
  - {label: 何も感じない,       valence: neu, arousal: low}
