# 写真のライフログの試用（#212）。正本はスマホと Google フォトのままで、ここのデータは捨ててよい。起動は mouse で:
#   cd ~/repo/dailybuild/scripts/ops/immich && docker compose up -d
# mouse は使っていないと寝る（~/repo/scripts の mouse-idle-suspend）。開いている画面（websocket）があれば寝ない。
# 公式 docker/docker-compose.yml（v3.4.1）が元。自動更新しない。版を上げるときはリリースノートを読み、db をバックアップしてから
# .env（git 外）に DB_PASSWORD（英数字のみ）。mouse では IMMICH_BIND=<mouse の tailnet IP>
# 写真・サムネイルの置き場は .env の UPLOAD_LOCATION（mouse では /mnt/shared/immich。Windows と共有の NTFS）。DB は NTFS に置かない
# ML は CPU で始める。CUDA 版の image は数 GB あり、mouse の /home（Docker の置き場）の空きが足りない
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.4.1
    environment: &db-env
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      TZ: Asia/Tokyo
    volumes:
      - ${UPLOAD_LOCATION:-library}:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${IMMICH_BIND:-127.0.0.1}:2283:2283"
    logging: &logging
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
    # 公式は起動順だけで、初回は DB の初期化前に繋ぎに行って1回落ちる
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    restart: unless-stopped

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.1
    environment:
      MACHINE_LEARNING_MODEL_REVISION: v2
      TZ: Asia/Tokyo
    volumes:
      - model-cache:/cache
    logging: *logging
    restart: unless-stopped

  redis:
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: unless-stopped

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - db-data:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped

volumes:
  library:
  db-data:
  model-cache:
