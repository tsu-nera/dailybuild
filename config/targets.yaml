# 数値目標管理ファイル
#
# 各 target:
#   key:       識別用キー（評価器コードは無い。現在値・残差はレビューAIがレポートを見て判断）
#   target:    目標値
#   unit:      表示単位
#   direction: up   = 大きいほど良い（残差 = target - current）
#              down = 小さいほど良い（残差 = current - target）
#              zero = 0が目標（残差 = current）
#   review:    weekly / monthly / quarterly
#   note:      補足
targets:
  - key: ffmi
    target: 19.0
    unit: ""
    direction: up
    review: monthly
    note: "除脂肪体重指数。身長170cm前提（src/lib/analytics/body.py DEFAULT_HEIGHT_CM）。引っ越し後の持久シフトで筋トレ習慣が中断。現状維持+α目標。律速はタンパク質≒100-113g/日（体重×1.6-1.8g）の確保"

  - key: sleep_debt_h
    target: 0
    unit: h
    direction: zero
    review: weekly
    note: "Oura方式の累積睡眠負債（src/lib/analytics/sleep/sleep_debt_clean.py）"

  - key: rise_time
    target: "05:45"
    unit: "時刻"
    direction: down
    review: weekly
    note: "布団を出た時刻（Fitbit の睡眠終了ではない。歩数の出始めと生活音で取る）。最終目標 05:00、05:45 から段階的に前倒しする。平日の8割以上で達成した週が2週続いたら15分早める（05:45→05:30→05:15→05:00）。2026-10-19 設定"

  - key: bed_time
    target: "22:30"
    unit: "時刻"
    direction: down
    review: weekly
    note: "入床。rise_time から睡眠7時間＋入眠15分を引いた時刻で、rise_time と同じ幅で動かす（最終 21:45）。2026-10-19 設定"
