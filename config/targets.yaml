# 数値目標管理ファイル
#
# 各 target:
#   key:       評価キー（src/lib/targets.py の EVALUATORS と一致）
#   target:    目標値
#   unit:      表示単位
#   direction: up   = 大きいほど良い（残差 = target - current）
#              down = 小さいほど良い（残差 = current - target）
#              zero = 0が目標（残差 = current）
#   review:    weekly / monthly / quarterly
#   note:      補足
targets:
  - key: ffmi
    target: 19.0
    unit: ""
    direction: up
    review: monthly
    note: "除脂肪体重指数。身長170cm前提（src/lib/analytics/body.py DEFAULT_HEIGHT_CM）。引っ越し後の持久シフトで筋トレ習慣が中断。現状維持+α目標。律速はタンパク質≒118g/日（体重×2g）の確保"

  - key: sleep_debt_h
    target: 0
    unit: h
    direction: zero
    review: weekly
    note: "Oura方式の累積睡眠負債（src/lib/analytics/sleep/sleep_debt_clean.py）"

  - key: zone2_min_weekly
    target: 150
    unit: min
    direction: up
    review: weekly
    note: "WHO推奨。Fitbit fatBurnActiveZoneMinutes の月-日合計"
