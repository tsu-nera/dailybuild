# 消耗品の補充管理の試用（#264）。起動は vaio で:
#   cd ~/repo/dailybuild/scripts/ops/grocy && docker compose up -d
# 初期ログインは admin / admin。最初にパスワードを変え、.env の GROCY_ADMIN_PASSWORD に控える
# 起動直後は DB が空で、GET / を一度踏むまで migration が走らない（その前の POST /login は 500）
services:
  grocy:
    image: lscr.io/linuxserver/grocy:v4.7.1-ls349
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Tokyo
      GROCY_CURRENCY: JPY
      GROCY_DEFAULT_LOCALE: ja
      # 使うのは在庫・買い物リスト・電池（定期交換品）だけ。家事・タスクは Todoist、説明書は Homebox が持つ
      GROCY_FEATURE_FLAG_RECIPES: "false"
      GROCY_FEATURE_FLAG_RECIPES_MEALPLAN: "false"
      GROCY_FEATURE_FLAG_CHORES: "false"
      GROCY_FEATURE_FLAG_TASKS: "false"
      GROCY_FEATURE_FLAG_EQUIPMENT: "false"
      GROCY_FEATURE_FLAG_CALENDAR: "false"
    volumes:
      - grocy-data:/config
    ports:
      - "${GROCY_BIND:-127.0.0.1}:3200:80"
    restart: unless-stopped

volumes:
  grocy-data:
