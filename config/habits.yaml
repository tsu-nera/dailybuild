# 習慣トラッキングの目標値
#
# **対象リストはここで管理しない。** Habitica にあるタスクが対象で、除外は
# Habitica 側の Tag「卒業」だけで決まる。リストを2箇所に持つと必ずずれる。
#
# ここが持つのは目標値だけ。Habitica の value は「やった／やらなかった」の
# 累積であって「週に何回やるか」を表現していないので、目標だけは外に要る。
#
# target_per_week は**空のまま始める**。過去データが5行しかなく、週何回できるかの
# 根拠が無いため。4週ぶん貯めてから実測の中央値をもとに埋める。

habits:
  坐禅:
    target_per_week:
  トランスDTM:
    target_per_week:
  NoFap:
    target_per_week:

# 卒業の判定に使う閾値。実際に卒業させる（Tag を付けて repeat を空にする）のは
# 手動で、レビューは候補を出すだけ。
graduate:
  # Habitica の value の色: 薄緑(good) 1〜5 / 緑(better) 5〜10 / 青(best) 10〜
  value_min: 5
  # 目標以上が何週続いたら候補にするか
  weeks: 8
