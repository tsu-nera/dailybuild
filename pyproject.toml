[project]
name = "dailybuild"
version = "0.1.0"
description = "ライフログデータ収集プロジェクト（Fitbit睡眠・HealthPlanet体組成）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "astral",
    "fitbit",
    "gspread",
    "pandas",
    "pyyaml",
    "requests",
    "requests-oauthlib",
    "jinja2>=3.1.0",
    "tabulate>=0.10.0",
    "matplotlib>=3.10.9",
    "scipy>=1.17.1",
    "google-api-python-client>=2.197.0",
]

[tool.uv]
package = false
