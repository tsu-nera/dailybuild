[project]
name = "dailybuild"
version = "0.1.0"
description = "ライフログデータ収集プロジェクト（Google Health・HealthPlanet ほか）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "astral",
    "gspread",
    "pandas",
    "pyyaml",
    "requests",
    "requests-oauthlib",
    "jinja2>=3.1.0",
    "tabulate>=0.10.0",
    "matplotlib>=3.10.9",
    "scipy>=1.17.1",
    "google-api-python-client>=2.197.0",
    # tabulate が全角文字の表示幅を正しく測るために必要（import されないが必須）
    "wcwidth>=0.8.2",
    # googlehealth_api.py が直接 import する（gspread の間接依存に頼らない）
    "google-auth>=2.53.0",
    "google-auth-oauthlib>=1.4.0",
    "playwright>=1.62.0",
    "openpyxl>=3.1.5",
    "tinytuya>=1.20.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
# tmp/ は gitignore 対象の作業領域。ベンダーコードのテストを拾わないよう収集対象を限定する
testpaths = ["tests"]
# net を既定で外す。実測で全体42秒のうち40秒がネットワーク8件（googlehealth の
# parity）で、残り234件は約2秒。毎回叩くと遅いうえ、API 側の応答で間欠的に落ちる。
# 外したぶんは fetch_googlehealth.py を触るときに `-m net` で回す（CLAUDE.md 参照表）。
markers = ["net: 外部 API を実際に叩く。既定では実行しない"]
addopts = "-m 'not net'"

