[project]
name = "dailybuild"
version = "0.1.0"
description = "ライフログデータ収集プロジェクト（Fitbit睡眠・HealthPlanet体組成）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "astral",
    "fitbit",
    "gspread",
    "pandas",
    "pyyaml",
    "requests",
    "requests-oauthlib",
    "jinja2>=3.1.0",
    "tabulate>=0.10.0",
    "matplotlib>=3.10.9",
    "scipy>=1.17.1",
    "google-api-python-client>=2.197.0",
    # tabulate が全角文字の表示幅を正しく測るために必要（import されないが必須）
    "wcwidth>=0.8.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
# tmp/ は gitignore 対象の作業領域。ベンダーコードのテストを拾わないよう収集対象を限定する
testpaths = ["tests"]
