# 数値目標管理ファイル
#
# 各 target:
#   key:       識別用キー（評価器コードは無い。現在値・残差はレビューAIがレポートを見て判断）
#   target:    目標値
#   unit:      表示単位
#   direction: up   = 大きいほど良い（残差 = target - current）
#              down = 小さいほど良い（残差 = current - target）
#              zero = 0が目標（残差 = current）
#   review:    weekly / monthly / quarterly
#   note:      補足
targets:
  - key: ffmi
    target: 19.0
    unit: ""
    direction: up
    review: monthly
    note: "除脂肪体重指数。身長170cm前提（src/lib/analytics/body.py DEFAULT_HEIGHT_CM）。引っ越し後の持久シフトで筋トレ習慣が中断。現状維持+α目標。律速はタンパク質≒118g/日（体重×2g）の確保"

  - key: sleep_debt_h
    target: 0
    unit: h
    direction: zero
    review: weekly
    note: "Oura方式の累積睡眠負債（src/lib/analytics/sleep/sleep_debt_clean.py）"

  - key: zone2_min_weekly
    target: 90
    unit: min
    direction: up
    review: weekly
    note: "現行目標90=頻度づくり(週3回×30分)の漸進目標。最終目標は150(WHO推奨=体力増強/ミトコンドリア新生)で較正後に引き上げる。指標はMAF Zone2(LT1アンカー[LT1-15,LT1))の週合計＝body日次レポート トレーニング欄Zone2列を週積算(旧Fitbit fatBurnから移行)。単一真実=config/personal.yaml zone2。LT1=141は未較正MAF暫定のため、較正(Talk Test→manual_bpm)まではレビューAIは絶対達成率でなく直近トレンドで評価する(較正前に高い値を絶対視するとLT1超え踏みを誘発)。経緯:issues/013_zone2/"
