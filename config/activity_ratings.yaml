# 活動ごとの楽しさ / 重要さ（0-10）。`activity.py sync` がこの表を見て
# シートの評定を埋める。**ここに無い活動は空欄のまま残す**（未評定であって
# 0 ではない）。追加は `activity.py rate '<活動名>' <楽しさ> <重要さ>`。
#
# キーは Toggl の "プロジェクト" か "プロジェクト: description"。後者が
# あればそちらを優先する。
#
# 原典では枠ごとに評定するが（Form 1）、活動ごとの評定は Form 2 の軸その
# もので、同じ活動に毎回違う値を付け直す運用は現実的でない。日ごとの
# ばらつきは捨てる代わりに、「楽しくも重要でもない時間の長さ」が測れる。
