# Fitbit睡眠等をTogglタイムエントリとして投入する際のソース別マッピング。
# scripts/toggl.py push が読む（src/lib/toggl/push.py, sources.py）。

sources:
  fitbit_sleep:
    enabled: true
    project: 睡眠
    description: "睡眠"
    tags: [auto]

  googlehealth_exercise:
    enabled: true
    # 同じ運動が複数プラットフォームから届く（Fitbit の Charge 6 と、
    # Health Connect 経由の Google Fit / Hevy が、ほぼ同じ時間帯を
    # 別セッションとして返す）重複解決（優先度・重なり閾値）は
    # src/lib/exercise_source.py の定数を使う（レポートと共有するため）
    # ここに無い exerciseType（WALKING / RUNNING 等）は投入しない
    categories:
      cycling:
        project: サイクリング
        description: "サイクリング"
        tags: [auto]
        exercise_types: [OUTDOOR_BIKE, BIKING, SPINNING]
      workout:
        project: 筋トレ
        description: "筋トレ"
        tags: [auto]
        exercise_types:
          - WEIGHTS
          - STRENGTH_TRAINING
          - WORKOUT
          - INTERVAL_WORKOUT
          - CIRCUIT_TRAINING
          - HIIT
      meditation:
        project: 瞑想
        description: "瞑想"
        tags: [auto]
        # Charge 6 のエクササイズ一覧に瞑想は無い。本体で計測するときは
        # YOGA を代用に使うので、瞑想として扱う（ヨガ自体はやらない）
        exercise_types: [MEDITATE, YOGA]
