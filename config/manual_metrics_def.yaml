# 手動記録メトリクス定義
# active: false にすると fetch_manual.py での取り込み対象から除外される

- metric: core_temperature
  unit: "°C"
  description: 起床直後の実測体温。37.0超は発熱、35台は低体温の疑い。客観の皮膚温Δと併読
  active: true

- metric: hrv_morning
  unit: ms
  description: 朝のHRV手動計測。低下=疲労蓄積/高=回復良好。Fitbit HRV(客観)との乖離を確認
  active: true

- metric: keto_morning
  unit: mmol/L
  description: 朝のケトン値（計測停止）
  active: false

- metric: mind_score
  unit: "1-5"
  description: 主観メンタルスコア（就寝前、高=良好）。HRV/RHR等の客観回復指標との一致・乖離を見る
  active: true

- metric: body_score
  unit: "1-5"
  description: 主観身体スコア（倦怠感・炎症感、高=良好）。客観回復指標と乖離する場合は末梢疲労や睡眠負債を疑う
  active: true

- metric: sleep_score
  unit: "1-5"
  description: 主観睡眠スコア（高=良好）。fitbit_sleep_score（客観）と乖離する場合は要注目
  active: true

- metric: comment
  unit: ""
  description: 日次コメント・自覚症状・特記事項。数値に出ない文脈の最重要ソース
  active: true

- metric: fitbit_sleep_score
  unit: "0-100"
  description: Fitbit睡眠スコア
  active: true

- metric: fitbit_energy_score
  unit: "0-100"
  description: Fitbitエネルギースコア
  active: true

- metric: rise_sleep_dept
  unit: ""
  description: Rise アプリの睡眠負債(h)。睡眠負債評価はsleepレポートのアルゴリズム値よりこちらを優先
  active: true

- metric: muse_paf
  unit: ""
  description: Muse PAF（Peak Alpha Frequency）
  active: true

- metric: caffeine_mg
  unit: mg
  description: カフェイン摂取量（飲まない日は0）。コーヒー1杯≈80-100mg。睡眠・入眠潜時・HRV・主観との観察的関連を見る（非ランダム化=因果は弱い、逆因果に注意）
  active: true

- metric: caffeine_time
  unit: ""
  description: 最終カフェイン摂取時刻（HH:MM）。半減期約5時間、夜への影響を左右する最重要交絡。摂取した日のみ記録
  active: true

# 以下は廃止
- metric: sickness_score
  unit: "1-5"
  description: 筋肉痛・身体疲労スコア（高=良好/疲労少）。HRVに現れない局所疲労の追跡用
  active: false

- metric: fitbit_stress_score
  unit: ""
  description: Fitbitストレススコア（API取得済み）
  active: false

- metric: fitbit_eda_scan
  unit: ""
  description: Fitbit EDAスキャン（記録なし）
  active: false
